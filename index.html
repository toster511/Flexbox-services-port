<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Services & Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Section 1: Our Services -->
        <section>
            <h2>OUR SERVICES</h2>
            <p class="subtitle">LET US HELP YOU TO CREATE PROFESSIONAL WEBSITES</p>
            
            <div class="services-list">
                <div class="service-card bg-teal">
                    <i class="fa-solid fa-code"></i>
                </div>
                <div class="service-card bg-green">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <div class="service-card bg-orange">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <div class="service-card bg-blue">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
            </div>
        </section>

        <!-- Section 2: Our Portfolio -->
        <section>
            <h2>OUR PORTFOLIO</h2>
            <p class="subtitle">WHAT WE HAVE DONE SO FAR</p>
            
            <div class="portfolio-list">
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=1" alt="Portfolio 1">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=2" alt="Portfolio 2">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=3" alt="Portfolio 3">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=4" alt="Portfolio 4">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=5" alt="Portfolio 5">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=6" alt="Portfolio 6">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=7" alt="Portfolio 7">
                </div>
                <div class="portfolio-card">
                    <img src="https://picsum.photos/300?random=8" alt="Portfolio 8">
                </div>
            </div>
        </section>
    </main>

</body>
</html>
